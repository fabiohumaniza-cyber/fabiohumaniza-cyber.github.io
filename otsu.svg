<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Otsu Paquímetro</title>
  <!-- disco de fundo -->
  <circle cx="256" cy="256" r="244" fill="#F3EDE4" stroke="#3A3F44" stroke-width="6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#3A3F44" stroke-width="1.5" stroke-dasharray="2 7"/>
  <!-- pele -->
  <path d="M60 330 Q256 300 452 330 L430 395 Q256 470 82 395 Z" fill="#E7C9A9"/>
  <!-- lesao: borda irregular -->
  <path d="M176 352 C170 326 196 306 226 310 C246 300 274 302 292 314 C320 312 340 334 334 356 C342 380 316 398 290 394 C270 406 238 404 222 396 C196 400 172 380 176 352 Z" fill="#4A2E22"/>
  <path d="M206 344 C214 330 240 326 258 334 C278 330 302 340 300 356 C296 372 270 376 252 372 C232 378 206 368 206 344 Z" fill="#2B1A14" opacity="0.55"/>
  <!-- haste do paquimetro -->
  <rect x="96" y="150" width="330" height="34" rx="3" fill="#8C959D" stroke="#3A3F44" stroke-width="3"/>
  <!-- escala -->
  <g stroke="#2E3338" stroke-width="2">
    <line x1="120" y1="150" x2="120" y2="166"/><line x1="135" y1="150" x2="135" y2="160"/>
    <line x1="150" y1="150" x2="150" y2="160"/><line x1="165" y1="150" x2="165" y2="160"/>
    <line x1="180" y1="150" x2="180" y2="166"/><line x1="195" y1="150" x2="195" y2="160"/>
    <line x1="210" y1="150" x2="210" y2="160"/><line x1="225" y1="150" x2="225" y2="160"/>
    <line x1="240" y1="150" x2="240" y2="166"/><line x1="255" y1="150" x2="255" y2="160"/>
    <line x1="270" y1="150" x2="270" y2="160"/><line x1="285" y1="150" x2="285" y2="160"/>
    <line x1="300" y1="150" x2="300" y2="166"/><line x1="315" y1="150" x2="315" y2="160"/>
    <line x1="330" y1="150" x2="330" y2="160"/><line x1="345" y1="150" x2="345" y2="160"/>
    <line x1="360" y1="150" x2="360" y2="166"/><line x1="375" y1="150" x2="375" y2="160"/>
    <line x1="390" y1="150" x2="390" y2="160"/><line x1="405" y1="150" x2="405" y2="160"/>
  </g>
  <!-- bico fixo (esquerda), encosta na borda esquerda da lesao -->
  <path d="M120 150 L150 150 L150 184 L178 300 L174 352 L168 352 L136 196 L120 184 Z" fill="#A3ABB2" stroke="#3A3F44" stroke-width="3" stroke-linejoin="round"/>
  <!-- cursor deslizante com o bico movel (direita), encosta na borda direita -->
  <path d="M300 138 L372 138 L372 196 L366 196 L340 352 L334 352 L330 300 L332 196 L300 196 Z" fill="#B7BEC4" stroke="#3A3F44" stroke-width="3" stroke-linejoin="round"/>
  <!-- histograma de Otsu gravado no cursor: dois picos e o limiar -->
  <path d="M306 186 C310 186 312 160 316 160 C320 160 322 186 328 186 C332 186 336 168 340 168 C346 168 350 186 366 186" fill="none" stroke="#2E3338" stroke-width="2"/>
  <line x1="331" y1="148" x2="331" y2="190" stroke="#B5482E" stroke-width="2.5"/>
  <!-- pontos de contato -->
  <circle cx="176" cy="352" r="5" fill="#B5482E"/>
  <circle cx="335" cy="356" r="5" fill="#B5482E"/>
  <!-- nome -->
  <text x="256" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#2E3338" letter-spacing="2">OTSU</text>
  <text x="256" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2E3338" letter-spacing="4">PAQUÍMETRO</text>
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#3A3F44" letter-spacing="3">MEDE ANTES DE AFIRMAR</text>
</svg>
